<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Metrics Kit</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #1c1917 0%, #0c0a09 100%);
      color: #fafaf9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #292524;
      border: 1px solid #44403c;
      border-radius: 12px;
      padding: 2rem 3rem;
      text-align: center;
      max-width: 480px;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fbbf24; }
    p { color: #a8a29e; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
    }
    .stat strong { display: block; font-size: 1.5rem; color: #fbbf24; }
    .stat span { font-size: 0.8rem; color: #78716c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Metrics Kit</h1>
    <p>Collect and export application metrics without external services.</p>
    <div class="stats">
      <div class="stat"><strong>3</strong><span>exporters</span></div>
      <div class="stat"><strong>12</strong><span>metric types</span></div>
    </div>
  </div>
</body>
</html>
