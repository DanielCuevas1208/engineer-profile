<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signal Router</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1f36 0%, #0d1117 100%);
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem 3rem;
      text-align: center;
      max-width: 480px;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #58a6ff; }
    p { color: #8b949e; }
    .badge {
      display: inline-block;
      background: #238636;
      color: #fff;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Signal Router</h1>
    <p>Route events between services with typed channels and backpressure.</p>
    <span class="badge">TypeScript · v0.3.0</span>
  </div>
</body>
</html>
