name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineer-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run fixture demo
        run: node dist/index.js demo

      - name: Publish demo with each theme
        run: |
          node dist/index.js publish --theme aurora
          node dist/index.js publish --theme terminal
          node dist/index.js publish --theme paper

      - name: Deploy demo output locally
        run: node dist/index.js deploy --adapter local --target deployment/preview

      - name: Store demo output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-profile-demo
          path: output/
          if-no-files-found: error